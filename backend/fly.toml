# fly.toml app configuration file generated for globalbuildestatewebapp-backend on 2026-06-01T02:25:10+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'globalbuildestatewebapp-backend'
primary_region = 'bom'

[build]

# Persistent disk: SQLite database + takeoff/BBS uploads survive deploys and restarts.
# Create once:  fly volumes create gbe_data --region bom --size 3 -a globalbuildestatewebapp-backend
[mounts]
  source = 'gbe_data'
  destination = '/data'

[env]
  DB_PATH = '/data/app.db'
  TAKEOFF_DIR = '/data/takeoff'
  BBS_DIR = '/data/bbs'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  # Quantity Takeoff loads full drawings in memory (~0.5 GB for a 40 MB DWG)
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
